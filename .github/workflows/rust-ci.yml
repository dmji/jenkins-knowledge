name: Rust CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace and container images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Cache Cargo registry, git dependencies, and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1

      - name: Validate clean checkout and all project contracts
        env:
          VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: sh scripts/validate.sh

      - name: Upload fixture Knowledge Package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knowledge-package-fixture
          path: target/fixture-package/
          if-no-files-found: error


  cross-component-contracts:
    name: Cross-component offline contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0

      - name: Cache Cargo registry, git dependencies, and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Exercise one Builder package through Runtime, LSP, and MCP
        run: cargo --locked test -p jenkins-contract-tests --test cross_component


  vscode-extension-host:
    name: VS Code extension-host acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0

      - name: Cache Cargo registry, git dependencies, and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Build fixture Knowledge Package and LSP
        run: |
          mkdir -p target/vscode-acceptance-fixture
          cp crates/jenkins-contract-tests/tests/fixtures/primary/{profile.yml,catalog.json,manifest.json} target/vscode-acceptance-fixture/
          sed -i 's#https://example.test/fixture-library.git#https://github.com/example/fixture-library.git#' target/vscode-acceptance-fixture/catalog.json
          cargo --locked run -p knowledge-builder -- build target/vscode-acceptance-fixture/profile.yml target/vscode-acceptance-package
          cargo --locked build -p jenkins-lsp

      - name: Run VS Code extension-host acceptance tests
        env:
          JENKINS_LSP_PATH: ${{ github.workspace }}/target/debug/jenkins-lsp
          JENKINS_KNOWLEDGE_PACKAGE: ${{ github.workspace }}/target/vscode-acceptance-package
        run: |
          npm --prefix editors/vscode ci --ignore-scripts --no-audit --no-fund
          xvfb-run -a npm --prefix editors/vscode test

  scanner-portability:
    name: Shared Library scanner portability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
      - name: Test Shared Library scanner
        run: cargo --locked test --manifest-path crates/shared-library-scanner/Cargo.toml --all-targets
