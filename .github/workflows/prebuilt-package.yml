name: Prebuilt Knowledge Package

on:
  pull_request:
    paths:
      - ".github/workflows/prebuilt-package.yml"
      - "profiles/prebuilt-jenkins-2.356.yml"
      - "tests/jenkins-2.356/**"
      - "crates/knowledge-builder/**"
      - "crates/jenkins-gdsl-collector/**"
      - "crates/shared-library-scanner/**"
      - "crates/catalog-validator/**"
      - "crates/jenkins-runtime/**"
      - "schemas/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  push:
    branches: [master]
    paths:
      - ".github/workflows/prebuilt-package.yml"
      - "profiles/prebuilt-jenkins-2.356.yml"
      - "tests/jenkins-2.356/**"
      - "crates/knowledge-builder/**"
      - "crates/jenkins-gdsl-collector/**"
      - "crates/shared-library-scanner/**"
      - "crates/catalog-validator/**"
      - "crates/jenkins-runtime/**"
      - "schemas/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-prebuilt-package:
    name: Jenkins 2.356 / Java 17 / deep package
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: prebuilt-jenkins-2356
      - name: Build, collect, and independently validate the package
        run: bash tests/jenkins-2.356/build-prebuilt.sh
      - name: Upload validated Knowledge Package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jenkins-2356-prebuilt-knowledge-package
          path: target/prebuilt-package/
          if-no-files-found: error
          retention-days: 30
