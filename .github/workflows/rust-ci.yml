name: Rust CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog-validator:
    name: Catalog validator
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry, git dependencies, and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/catalog-validator -> target
            crates/jenkins-gdsl-collector -> target
            crates/shared-library-scanner -> target
            crates/declarative-model -> target
            crates/jenkins-runtime -> target
          shared-key: rust-crates
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --manifest-path crates/catalog-validator/Cargo.toml -- --check

      - name: Run tests
        run: cargo test --manifest-path crates/catalog-validator/Cargo.toml --all-targets

      - name: Run Clippy
        run: cargo clippy --manifest-path crates/catalog-validator/Cargo.toml --all-targets -- -D warnings

      - name: Check collector formatting
        run: cargo fmt --manifest-path crates/jenkins-gdsl-collector/Cargo.toml && cargo fmt --manifest-path crates/jenkins-gdsl-collector/Cargo.toml -- --check

      - name: Test collector
        run: cargo test --manifest-path crates/jenkins-gdsl-collector/Cargo.toml --all-targets

      - name: Lint collector
        run: cargo clippy --manifest-path crates/jenkins-gdsl-collector/Cargo.toml --all-targets -- -D warnings

      - name: Check shared library scanner formatting
        run: cargo fmt --manifest-path crates/shared-library-scanner/Cargo.toml && cargo fmt --manifest-path crates/shared-library-scanner/Cargo.toml -- --check

      - name: Test shared library scanner
        run: cargo test --manifest-path crates/shared-library-scanner/Cargo.toml --all-targets

      - name: Lint shared library scanner
        run: cargo clippy --manifest-path crates/shared-library-scanner/Cargo.toml --all-targets -- -D warnings

      - name: Check Declarative Pipeline model formatting
        run: cargo fmt --manifest-path crates/declarative-model/Cargo.toml && cargo fmt --manifest-path crates/declarative-model/Cargo.toml -- --check

      - name: Test Declarative Pipeline model
        run: cargo test --manifest-path crates/declarative-model/Cargo.toml --all-targets

      - name: Lint Declarative Pipeline model
        run: cargo clippy --manifest-path crates/declarative-model/Cargo.toml --all-targets -- -D warnings

      - name: Validate example catalog
        run: cargo run --manifest-path crates/catalog-validator/Cargo.toml -- examples/catalog/catalog.json schemas/catalog.schema.json

      - name: Check Runtime formatting
        run: cargo fmt --manifest-path crates/jenkins-runtime/Cargo.toml -- --check

      - name: Test Runtime
        run: cargo test --manifest-path crates/jenkins-runtime/Cargo.toml --all-targets

      - name: Lint Runtime
        run: cargo clippy --manifest-path crates/jenkins-runtime/Cargo.toml --all-targets -- -D warnings
