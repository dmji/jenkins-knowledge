name: Rust CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Dev Container, package, and image validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run repository validation in the Dev Container
        uses: devcontainers/ci@v0.3
        with:
          runCmd: bash scripts/validate.sh
          push: never

      - name: Build Builder image
        run: docker build --file containers/builder/Dockerfile --tag jenkins-knowledge-builder:ci .

      - name: Build Runtime image
        run: docker build --file containers/runtime/Dockerfile --tag jenkins-knowledge-runtime:ci .

      - name: Verify Builder and Runtime separation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          rm -rf target/container-fixture-package

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            jenkins-knowledge-builder:ci \
            build profiles/fixture.yml target/container-fixture-package

          docker run --rm \
            --volume "$GITHUB_WORKSPACE/target/container-fixture-package:/package:ro" \
            jenkins-knowledge-runtime:ci \
            --package /package search deploy > "$GITHUB_WORKSPACE/target/runtime-image-search.json"

          grep -q '"name": "deploy"' "$GITHUB_WORKSPACE/target/runtime-image-search.json"
          docker run --rm --entrypoint git jenkins-knowledge-builder:ci --version

          docker run --rm --entrypoint sh jenkins-knowledge-runtime:ci -ec '
            for command in git cargo knowledge-builder catalog-validator; do
              if command -v "$command" >/dev/null 2>&1; then
                echo "Runtime image unexpectedly contains $command" >&2
                exit 1
              fi
            done
            command -v jenkins-runtime >/dev/null
          '

      - name: Upload fixture Knowledge Package
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-package-fixture
          path: target/fixture-package/
          if-no-files-found: error
