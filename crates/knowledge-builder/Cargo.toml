[package]
name = "knowledge-builder"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
catalog-validator = { path = "../catalog-validator" }
declarative-model = { path = "../declarative-model" }
jenkins-gdsl-collector = { path = "../jenkins-gdsl-collector" }
shared-library-scanner = { path = "../shared-library-scanner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
jsonschema = "0.29"
tempfile = "3"
url = "2"
