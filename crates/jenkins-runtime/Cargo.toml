[package]
name = "jenkins-runtime"
version = "0.1.0"
edition = "2021"
default-run = "jenkins-runtime"
publish = false

[dependencies]
catalog-validator = { path = "../catalog-validator" }
jsonschema = "0.63"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "jenkins-mcp"
path = "src/bin/mcp.rs"

[[bin]]
name = "groovy-stubs"
path = "src/bin/groovy-stubs.rs"
