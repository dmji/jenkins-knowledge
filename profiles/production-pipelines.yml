profile: production-pipelines

jenkins:
  controllers:
    - id: production
      url: https://jenkins.example.invalid
      # Credentials are supplied to the builder at runtime, never committed here.

libraries:
  - name: platform-lib
    url: https://git.example.invalid/platform-lib.git
    revision: release/2.x
    # Optional: pin to a resolved 40-character commit SHA for reproducible builds.
  - name: deployment-lib
    url: https://git.example.invalid/deployment-lib.git
    revision: main
    # Optional: pin to a resolved 40-character commit SHA for reproducible builds.

package:
  id: production-pipelines
  include:
    - jenkins-core
    - controller
    - plugins
    - shared-libraries
