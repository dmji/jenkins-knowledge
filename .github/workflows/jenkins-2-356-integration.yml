name: Jenkins 2.356 integration

on:
  pull_request:
    paths:
      - ".github/workflows/jenkins-2-356-integration.yml"
      - "tests/jenkins-2.356/**"
      - "demo/**"
      - "editors/vscode/**"
      - "Dockerfile.builder"
      - "Dockerfile.runtime"
      - ".dockerignore"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/knowledge-builder/**"
      - "crates/jenkins-gdsl-collector/**"
      - "crates/shared-library-scanner/**"
      - "crates/catalog-validator/**"
      - "schemas/catalog.schema.json"
      - "editors/vscode/**"
      - "crates/jenkins-lsp/**"
      - "crates/jenkins-contract-tests/**"
      - "Cargo.lock"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/jenkins-2-356-integration.yml"
      - "tests/jenkins-2.356/**"
      - "demo/**"
      - "editors/vscode/**"
      - "Dockerfile.builder"
      - "Dockerfile.runtime"
      - ".dockerignore"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/knowledge-builder/**"
      - "crates/jenkins-gdsl-collector/**"
      - "crates/shared-library-scanner/**"
      - "crates/catalog-validator/**"
      - "schemas/catalog.schema.json"
      - "editors/vscode/**"
      - "crates/jenkins-lsp/**"
      - "crates/jenkins-contract-tests/**"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Jenkins 2.356 / Java 17 / pinned plugins
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: jenkins-2356
      - name: Run live Jenkins 2.356 collection matrix
        run: bash tests/jenkins-2.356/run.sh
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Run VS Code extension-host acceptance
        run: bash tests/jenkins-2.356/run-vscode-acceptance.sh
      - name: Upload sanitized Jenkins evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jenkins-2.356-integration-evidence
          path: target/jenkins-2.356/
          if-no-files-found: warn
          retention-days: 14

  demo-environment:
    name: Compose demo / Pipeline / Builder / Runtime / MCP / VS Code
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: jenkins-2356-demo
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Build and start the local Jenkins demo
        run: bash demo/up.sh
      - name: Build the Knowledge Package
        run: bash demo/build-package.sh
      - name: Verify Pipeline, Runtime, MCP, LSP, and VS Code
        run: bash demo/verify.sh
      - name: Remove demo containers, volumes, and credentials
        if: always()
        run: bash demo/down.sh --reset
