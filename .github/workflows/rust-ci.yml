name: Rust CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-validator:
    name: Catalog validator
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --manifest-path crates/catalog-validator/Cargo.toml -- --check

      - name: Run tests
        run: cargo test --manifest-path crates/catalog-validator/Cargo.toml --all-targets

      - name: Run Clippy
        run: cargo clippy --manifest-path crates/catalog-validator/Cargo.toml --all-targets -- -D warnings

      - name: Validate example catalog
        run: cargo run --manifest-path crates/catalog-validator/Cargo.toml -- examples/catalog/catalog.json schemas/catalog.schema.json
