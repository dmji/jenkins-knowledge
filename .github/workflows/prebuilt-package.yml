name: Prebuilt Knowledge Package

on:
  pull_request:
    paths:
      - ".github/workflows/prebuilt-package.yml"
      - "profiles/prebuilt-jenkins-2.356.yml"
      - "tests/jenkins-2.356/**"
      - "crates/knowledge-builder/**"
      - "crates/jenkins-gdsl-collector/**"
      - "crates/shared-library-scanner/**"
      - "crates/catalog-validator/**"
      - "crates/jenkins-runtime/**"
      - "crates/jenkins-lsp/**"
      - "schemas/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - ".github/workflows/prebuilt-package.yml"
      - "profiles/prebuilt-jenkins-2.356.yml"
      - "tests/jenkins-2.356/**"
      - "crates/knowledge-builder/**"
      - "crates/jenkins-gdsl-collector/**"
      - "crates/shared-library-scanner/**"
      - "crates/catalog-validator/**"
      - "crates/jenkins-runtime/**"
      - "crates/jenkins-lsp/**"
      - "schemas/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-prebuilt-package:
    name: Jenkins 2.356 / Java 17 / deep package
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: prebuilt-jenkins-2356
      - name: Build, collect, and independently validate the package
        run: bash tests/jenkins-2.356/build-prebuilt.sh
      - name: Verify release archive and external checksum
        run: bash tests/jenkins-2.356/package-prebuilt-release.sh v0.0.0-test target/prebuilt-package target/release-test "$GITHUB_SHA"
      - name: Upload validated Knowledge Package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jenkins-2356-prebuilt-knowledge-package
          path: target/prebuilt-package/
          if-no-files-found: error
          retention-days: 30

  build-runtime-binaries:
    name: Tool bundle (${{ matrix.platform }})
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    needs: build-prebuilt-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: windows-x86_64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
      - name: Download validated reference package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jenkins-2356-prebuilt-knowledge-package
          path: target/prebuilt-package
      - name: Checkout release smoke helper from master
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: smoke-helpers
      - name: Build all user-facing executables
        run: |
          cargo build --locked --release --manifest-path crates/knowledge-builder/Cargo.toml
          cargo build --locked --release --manifest-path crates/jenkins-runtime/Cargo.toml --bin jenkins-runtime --bin jenkins-mcp --bin groovy-stubs
          cargo build --locked --release --manifest-path crates/jenkins-lsp/Cargo.toml --bin jenkins-lsp
      - name: Smoke-test packaged executables against the reference package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then PYTHON=python; else PYTHON=python3; fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BUILDER="target/release/knowledge-builder.exe"
            CLI="target/release/jenkins-runtime.exe"
            MCP="target/release/jenkins-mcp.exe"
            LSP="target/release/jenkins-lsp.exe"
            STUBS="target/release/groovy-stubs.exe"
          else
            BUILDER="target/release/knowledge-builder"
            CLI="target/release/jenkins-runtime"
            MCP="target/release/jenkins-mcp"
            LSP="target/release/jenkins-lsp"
            STUBS="target/release/groovy-stubs"
          fi
          set +e
          "$BUILDER" --help > target/builder-help.txt 2>&1
          BUILDER_HELP_STATUS=$?
          set -e
          if [[ "$BUILDER_HELP_STATUS" -ne 0 && "$BUILDER_HELP_STATUS" -ne 2 ]]; then
            cat target/builder-help.txt
            exit "$BUILDER_HELP_STATUS"
          fi
          grep -q 'knowledge-builder build' target/builder-help.txt
          "$BUILDER" plan profiles/prebuilt-jenkins-2.356.yml > target/builder-plan.json
          "$PYTHON" -c 'import json; p=json.load(open("target/builder-plan.json")); assert p'
          "$CLI" --help
          "$CLI" --package target/prebuilt-package plugins > target/runtime-plugins.json
          "$STUBS" --help
          "$STUBS" --package target/prebuilt-package --output target/groovy-stubs.groovy
          test -s target/groovy-stubs.groovy
          cat <<'JSONL' | "$MCP" --package target/prebuilt-package > target/mcp-smoke.jsonl
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release-smoke-test","version":"1"}}}
          {"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}
          {"jsonrpc":"2.0","id":3,"method":"resources/list","params":{}}
          JSONL
          grep -q '"protocolVersion":"2025-06-18"' target/mcp-smoke.jsonl
          grep -q '"name":"search_api"' target/mcp-smoke.jsonl
          grep -q '"uri":"jenkins://catalog/manifest"' target/mcp-smoke.jsonl
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            LSP_SMOKE="smoke-helpers/tests/jenkins-2.356/smoke-lsp.py"
          else
            LSP_SMOKE="tests/jenkins-2.356/smoke-lsp.py"
          fi
          "$PYTHON" "$LSP_SMOKE" "$LSP" target/prebuilt-package
      - name: Package platform binaries and verify checksum
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          STAGING="target/tools-${PLATFORM}"
          mkdir -p "$STAGING/bin"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/release/knowledge-builder.exe "$STAGING/bin/"
            cp target/release/jenkins-runtime.exe "$STAGING/bin/"
            cp target/release/jenkins-mcp.exe "$STAGING/bin/"
            cp target/release/jenkins-lsp.exe "$STAGING/bin/"
            cp target/release/groovy-stubs.exe "$STAGING/bin/"
          else
            cp target/release/knowledge-builder "$STAGING/bin/"
            cp target/release/jenkins-runtime "$STAGING/bin/"
            cp target/release/jenkins-mcp "$STAGING/bin/"
            cp target/release/jenkins-lsp "$STAGING/bin/"
            cp target/release/groovy-stubs "$STAGING/bin/"
            chmod 755 "$STAGING/bin/knowledge-builder" "$STAGING/bin/jenkins-runtime" "$STAGING/bin/jenkins-mcp" "$STAGING/bin/jenkins-lsp" "$STAGING/bin/groovy-stubs"
          fi
          cat > "$STAGING/README.txt" <<'EOF'
Jenkins Knowledge platform tool bundle

bin/knowledge-builder  Build/refresh a Knowledge Package from a configured Jenkins controller.
bin/jenkins-runtime    Offline CLI for searching and inspecting a selected package.
bin/jenkins-mcp        Local MCP stdio server for AI-agent clients.
bin/jenkins-lsp        Local LSP stdio server for editor integrations.
bin/groovy-stubs       Offline Groovy stub generator for a selected package.

Builder collection requires network access to the configured Jenkins/Shared Library sources
and credentials supplied through JENKINS_USERNAME and JENKINS_API_TOKEN. Runtime, MCP, LSP,
and groovy-stubs only read a local package and do not contact Jenkins/Git.

The MCP server receives --package <directory> (or JENKINS_KNOWLEDGE_PACKAGE).
The LSP server receives packagePath/profile in the LSP initialize.initializationOptions.
See https://github.com/dmji/jenkins-knowledge for profiles and integration configuration.
EOF
          ARCHIVE="jenkins-knowledge-tools-${RELEASE_TAG}-${PLATFORM}.tar.gz"
          tar -czf "target/$ARCHIVE" -C "$STAGING" .
          (cd target && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")
          (cd target && sha256sum --check "$ARCHIVE.sha256")
          tar -tzf "target/$ARCHIVE" > "target/$ARCHIVE.contents"
          grep -q 'bin/knowledge-builder' "target/$ARCHIVE.contents"
          grep -q 'bin/jenkins-runtime' "target/$ARCHIVE.contents"
          grep -q 'bin/jenkins-mcp' "target/$ARCHIVE.contents"
          grep -q 'bin/jenkins-lsp' "target/$ARCHIVE.contents"
          grep -q 'bin/groovy-stubs' "target/$ARCHIVE.contents"
      - name: Upload verified platform archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-${{ matrix.platform }}
          path: |
            target/jenkins-knowledge-tools-*.tar.gz
            target/jenkins-knowledge-tools-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  publish-github-release:
    name: Publish versioned GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-prebuilt-package, build-runtime-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
      - name: Build Runtime for package archive verification
        run: cargo build --locked --manifest-path crates/jenkins-runtime/Cargo.toml --bin jenkins-runtime
      - name: Download validated Knowledge Package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jenkins-2356-prebuilt-knowledge-package
          path: target/prebuilt-package
      - name: Download all verified Runtime platform archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tools-*
          path: target/runtime-assets
          merge-multiple: true
      - name: Require a version tag pointing to master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Package, checksum, and verify Knowledge Package archive
        run: bash tests/jenkins-2.356/package-prebuilt-release.sh "$GITHUB_REF_NAME" target/prebuilt-package target/release "$GITHUB_SHA"
      - name: Verify complete platform tool bundle matrix
        run: |
          set -euo pipefail
          for platform in linux-x86_64 macos-aarch64 macos-x86_64 windows-x86_64; do
            archive="target/runtime-assets/jenkins-knowledge-tools-${GITHUB_REF_NAME}-${platform}.tar.gz"
            test -s "$archive"
            test -s "$archive.sha256"
            (cd target/runtime-assets && sha256sum --check "$(basename "$archive").sha256")
            tar -tzf "$archive" > "$archive.contents"
            grep -q 'bin/knowledge-builder' "$archive.contents"
            grep -q 'bin/jenkins-runtime' "$archive.contents"
            grep -q 'bin/jenkins-mcp' "$archive.contents"
            grep -q 'bin/jenkins-lsp' "$archive.contents"
            grep -q 'bin/groovy-stubs' "$archive.contents"
          done
      - name: Add platform support and quick-start notes
        run: |
          cat >> target/release/RELEASE-NOTES.md <<'EOF'

          ## Platform tool bundles

          Download the tool bundle matching your host platform and the separate
          Knowledge Package archive. Verify each checksum before extraction.
          Each bundle contains knowledge-builder, jenkins-runtime, jenkins-mcp,
          jenkins-lsp, and groovy-stubs. Supported hosts: Linux x86_64, macOS Apple
          Silicon (aarch64), macOS Intel (x86_64), and Windows x86_64. No Rust
          toolchain or source checkout is required to run the bundled executables.

          Builder collection requires network access and Jenkins/Git credentials.
          Runtime, MCP, LSP, and groovy-stubs are offline package consumers.
          Runtime validates the package manifest, embedded manifest/catalog schemas,
          package metadata, and declared SHA-256 checksums when opening a package.
          This is a format/schema compatibility check, not a guarantee that a
          reference package describes a different Jenkins installation.
          EOF
      - name: Publish or append verified assets without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PACKAGE="target/release/jenkins-knowledge-${GITHUB_REF_NAME}-jenkins-2.356-java17-deep.tar.gz"
          CHECKSUM="$PACKAGE.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file target/release/RELEASE-NOTES.md
            gh release upload "$GITHUB_REF_NAME" "$PACKAGE" "$CHECKSUM" target/runtime-assets/*.tar.gz target/runtime-assets/*.tar.gz.sha256
          else
            gh release create "$GITHUB_REF_NAME" \
              "$PACKAGE" "$CHECKSUM" \
              target/runtime-assets/*.tar.gz target/runtime-assets/*.tar.gz.sha256 \
              --verify-tag \
              --title "Jenkins Knowledge $GITHUB_REF_NAME — Jenkins 2.356 / Java 17" \
              --notes-file target/release/RELEASE-NOTES.md
          fi
