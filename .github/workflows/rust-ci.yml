name: Rust CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace and container images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry, git dependencies, and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate clean checkout and all project contracts
        env:
          VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: sh scripts/validate.sh

      - name: Upload fixture Knowledge Package
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-package-fixture
          path: target/fixture-package/
          if-no-files-found: error

      - name: Upload temporary dependency lockfile bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfile-bootstrap
          path: target/lockfile-bootstrap/
          if-no-files-found: error

  scanner-portability:
    name: Shared Library scanner portability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test Shared Library scanner
        run: cargo test --manifest-path crates/shared-library-scanner/Cargo.toml --all-targets
