[package]
name = "jenkins-runtime"
version = "0.1.0"
edition = "2021"
default-run = "jenkins-runtime"
publish = false

[dependencies]
catalog-validator = { path = "../catalog-validator" }
jsonschema = "0.29"
serde_json = "1"

[[bin]]
name = "jenkins-mcp"
path = "src/bin/mcp.rs"

[[bin]]
name = "groovy-stubs"
path = "src/bin/groovy-stubs.rs"
